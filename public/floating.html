<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>番茄钟浮窗</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 100vh;
        padding: 0 16px;
        background: #ffffff;
        border: 1px solid #d2d2d7;
        border-radius: 9999px;
        /* The whole pill drags the frameless window; the button opts out. */
        -webkit-app-region: drag;
      }
      #pom-time {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        color: #1d1d1f;
      }
      #pom-action {
        font-size: 13px;
        min-height: 30px;
        padding: 0 14px;
        border-radius: 9999px;
        border: 1px solid #d2d2d7;
        background: #ffffff;
        color: #0066cc;
        cursor: pointer;
        font-family: inherit;
        -webkit-app-region: no-drag;
      }
      #pom-action:active {
        background: #f5f5f7;
      }
      #pom-close {
        font-size: 16px;
        line-height: 1;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: none;
        color: #86868b;
        cursor: pointer;
        font-family: inherit;
        -webkit-app-region: no-drag;
      }
      #pom-close:hover {
        background: #f5f5f7;
        color: #1d1d1f;
      }
    </style>
  </head>
  <body>
    <div class="pill">
      <span id="pom-time">25:00</span>
      <button id="pom-action">开始</button>
      <button id="pom-close" aria-label="关闭浮窗">×</button>
    </div>
    <script>
      ;(function () {
        var time = document.getElementById('pom-time')
        var action = document.getElementById('pom-action')
        var channel = new BroadcastChannel('orbit-pomodoro-pip')

        document.getElementById('pom-close').onclick = function () {
          if (window.orbitFloating && window.orbitFloating.close) {
            window.orbitFloating.close()
          } else {
            window.close()
          }
        }

        function fmt(totalSec) {
          var safe = Math.max(0, Math.floor(totalSec))
          var m = String(Math.floor(safe / 60)).padStart(2, '0')
          var s = String(safe % 60).padStart(2, '0')
          return m + ':' + s
        }

        function render(state) {
          if (!state) return
          if (state.phase === 'running' || state.phase === 'break-running') {
            time.textContent = fmt(state.remaining)
          } else if (state.phase === 'break-idle') {
            time.textContent = fmt(state.breakSec)
          } else if (state.phase === 'summary') {
            time.textContent = '00:00'
          } else {
            time.textContent = fmt(state.durationMin * 60)
          }

          if (state.phase === 'idle') {
            action.textContent = '开始'
            action.onclick = function () {
              send('startFocus')
            }
          } else if (state.phase === 'running') {
            action.textContent = '终止'
            action.onclick = function () {
              send('cancelFocus')
            }
          } else if (state.phase === 'break-idle') {
            action.textContent = '休息'
            action.onclick = function () {
              send('startBreak')
            }
          } else if (state.phase === 'break-running') {
            action.textContent = '跳过'
            action.onclick = function () {
              send('skipBreak')
            }
          } else {
            action.textContent = '完成'
            action.onclick = null
          }
        }

        function send(actionName) {
          channel.postMessage({ type: 'control', action: actionName })
        }

        var gotState = false
        channel.onmessage = function (event) {
          if (event.data && event.data.type === 'state') {
            gotState = true
            render(event.data)
          }
        }
        // Retry the handshake until the main window answers, so a race at
        // launch never leaves the floating window stuck on its defaults.
        channel.postMessage({ type: 'ready' })
        setInterval(function () {
          if (!gotState) channel.postMessage({ type: 'ready' })
        }, 1000)
      })()
    </script>
  </body>
</html>
